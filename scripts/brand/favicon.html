<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:512px; height:512px; overflow:hidden; background:#0A1B33; }
  .mark { width:512px; height:512px; display:flex; align-items:center; justify-content:center; gap:30px; }
  .b { width:58px; height:330px; box-sizing:border-box; border:38px solid #fff; }
  .l { border-right:none; } .r { border-left:none; }
  .o { font-family:Inter, sans-serif; font-weight:800; font-size:300px; line-height:1; color:#C9A961;
       letter-spacing:-0.02em; transform:translateY(-6px); }
</style></head>
<body><div class="mark"><span class="b l"></span><span class="o">O</span><span class="b r"></span></div></body></html>
