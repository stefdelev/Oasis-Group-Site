<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,350;1,9..144,350&family=Inter:wght@400;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --navy:#0A1B33; --gold:#C9A961; --gold-soft:#E4CC95; }
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:var(--navy); }
  .card { position:relative; width:1200px; height:630px; box-sizing:border-box; padding:64px 72px; color:#fff;
          background: radial-gradient(ellipse 60% 80% at 82% 50%, rgba(201,169,97,0.07), transparent 70%), var(--navy); }
  .wordmark { display:inline-flex; align-items:center; gap:14px; font-family:Inter, sans-serif; }
  .wordmark .b { display:inline-block; width:11px; height:36px; border-top:2px solid #fff; border-bottom:2px solid #fff; }
  .wordmark .l { border-left:2px solid #fff; } .wordmark .r { border-right:2px solid #fff; }
  .wordmark .t { font-size:22px; font-weight:400; letter-spacing:0.04em; }
  .wordmark strong { font-weight:800; letter-spacing:0.02em; }
  .eyebrow { margin-top:92px; display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono', monospace;
             font-weight:500; font-size:17px; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); }
  .eyebrow::before { content:''; width:36px; height:1px; background:var(--gold); }
  h1 { margin:26px 0 0; font-family:Fraunces, serif; font-weight:350; font-size:92px; line-height:0.98;
       letter-spacing:-0.02em; font-variation-settings:'opsz' 144; }
  h1 em { font-style:italic; color:var(--gold-soft); }
  .foot { position:absolute; left:72px; bottom:56px; width:560px; padding-top:18px; border-top:1px solid rgba(255,255,255,0.14);
          display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-weight:500;
          font-size:15px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.6); }
  .art { position:absolute; right:64px; top:95px; width:440px; height:440px; }
  .art svg { width:100%; height:100%; }
  .art .frame { position:absolute; inset:0; border:1px solid rgba(255,255,255,0.10); }
  .art .c { position:absolute; width:28px; height:28px; border:2px solid var(--gold); }
  .tl{top:-2px;left:-2px;border-right:none!important;border-bottom:none!important}
  .tr{top:-2px;right:-2px;border-left:none!important;border-bottom:none!important}
  .bl{bottom:-2px;left:-2px;border-right:none!important;border-top:none!important}
  .br{bottom:-2px;right:-2px;border-left:none!important;border-top:none!important}
</style></head>
<body><div class="card">
  <div class="wordmark"><span class="b l"></span><span class="t">THE <strong>OASIS</strong> GROUP</span><span class="b r"></span></div>
  <div class="eyebrow">Boutique advisory · Frontier technology</div>
  <h1>Architects of the<br><em>Digital Frontier.</em></h1>
  <div class="foot"><span>theoasisgroup.xyz</span><span>Caribbean → Global South</span></div>
  <div class="art"><div class="frame"></div><svg
      viewBox="0 0 480 480"
      xmlns="http://www.w3.org/2000/svg"
      
      
    >
      <defs>
        <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="rgba(201,169,97,0.18)" />
          <stop offset="60%"  stop-color="rgba(201,169,97,0.04)" />
          <stop offset="100%" stop-color="rgba(201,169,97,0)" />
        </radialGradient>
        <linearGradient id="meridian" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="rgba(201,169,97,0)" />
          <stop offset="50%"  stop-color="rgba(201,169,97,0.55)" />
          <stop offset="100%" stop-color="rgba(201,169,97,0)" />
        </linearGradient>
      </defs>

      <circle cx="240" cy="240" r="220" fill="url(#globeGlow)" />

      <circle cx="240" cy="240" r="180" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" />
      <circle cx="240" cy="240" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 6" />
      <circle cx="240" cy="240" r="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

      <ellipse cx="240" cy="240" rx="180" ry="60"  fill="none" stroke="rgba(91,139,149,0.30)" stroke-width="0.8" />
      <ellipse cx="240" cy="240" rx="180" ry="100" fill="none" stroke="rgba(91,139,149,0.22)" stroke-width="0.8" />
      <ellipse cx="240" cy="240" rx="180" ry="140" fill="none" stroke="rgba(91,139,149,0.16)" stroke-width="0.8" />

      <ellipse cx="240" cy="240" rx="60"  ry="180" fill="none" stroke="url(#meridian)" stroke-width="1" />
      <ellipse cx="240" cy="240" rx="100" ry="180" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8" />
      <ellipse cx="240" cy="240" rx="140" ry="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />

      <line x1="60"  y1="240" x2="420" y2="240" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
      <line x1="240" y1="60"  x2="240" y2="420" stroke="rgba(255,255,255,0.10)" stroke-width="1" />

      <circle cx="180" cy="180" r="14" fill="rgba(201,169,97,0.12)"/><circle cx="180" cy="180" r="3.5" fill="#C9A961"/><circle cx="310" cy="200" r="14" fill="rgba(201,169,97,0.12)"/><circle cx="310" cy="200" r="3.5" fill="#C9A961"/><circle cx="200" cy="300" r="14" fill="rgba(201,169,97,0.12)"/><circle cx="200" cy="300" r="3.5" fill="#C9A961"/><circle cx="330" cy="320" r="14" fill="rgba(201,169,97,0.12)"/><circle cx="330" cy="320" r="3.5" fill="#C9A961"/><circle cx="150" cy="260" r="14" fill="rgba(201,169,97,0.12)"/><circle cx="150" cy="260" r="3.5" fill="#C9A961"/><circle cx="285" cy="145" r="14" fill="rgba(201,169,97,0.12)"/><circle cx="285" cy="145" r="3.5" fill="#C9A961"/>

      <g stroke="rgba(201,169,97,0.35)" stroke-width="0.8" fill="none">
        <path d="M 180 180 Q 240 130 310 200" />
        <path d="M 180 180 Q 220 240 200 300" />
        <path d="M 310 200 Q 360 250 330 320" />
        <path d="M 200 300 Q 270 310 330 320" />
        <path d="M 150 260 Q 180 220 180 180" />
      </g>

      <g stroke="rgba(255,255,255,0.4)" stroke-width="1">
        <line x1="60"  y1="60"  x2="80"  y2="60" /><line x1="60"  y1="60"  x2="60"  y2="80" />
        <line x1="420" y1="60"  x2="400" y2="60" /><line x1="420" y1="60"  x2="420" y2="80" />
        <line x1="60"  y1="420" x2="80"  y2="420" /><line x1="60"  y1="420" x2="60"  y2="400" />
        <line x1="420" y1="420" x2="400" y2="420" /><line x1="420" y1="420" x2="420" y2="400" />
      </g>
    </svg><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div>
</div></body></html>
